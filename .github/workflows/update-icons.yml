name: Update MUI Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update MUI packages to latest
        run: npm install @mui/material@latest @mui/icons-material@latest

      - name: Generate SVG sources
        run: npm run gen-svg

      - name: Generate icon paths
        run: npm run gen-pathes

      - name: Sync version from @mui/icons-material dependency
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

          // Read the version range from dependencies (or devDependencies)
          const depRange =
            (pkg.dependencies && pkg.dependencies['@mui/icons-material']) ||
            (pkg.devDependencies && pkg.devDependencies['@mui/icons-material']);
          if (!depRange) {
            console.error('Cannot find @mui/icons-material in dependencies');
            process.exit(1);
          }

          // Strip leading ^, ~, etc.
          const muiVersion = depRange.replace(/^[^\d]*/, '');

          const [pMaj, pMin, pPatch] = pkg.version.split('.').map(Number);
          const [mMaj, mMin, mPatch] = muiVersion.split('.').map(Number);

          // If major/minor of MUI advanced, sync exactly; otherwise bump patch as needed
          if (mMaj * 10000 + mMin > pMaj * 10000 + pMin) {
            pkg.version = `${mMaj}.${mMin}.${mPatch}`;
          } else {
            const nextPatch =
              mMaj === pMaj && mMin === pMin
                ? Math.max(mPatch, pPatch) + 1
                : Math.max(mPatch, pPatch);
            pkg.version = `${pMaj}.${pMin}.${nextPatch}`;
          }

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icons html package.json
          git commit -m "chore: update generated icons" || echo "No changes to commit"
          git push
